name: Natural Trends Daily Report

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # Triggered by Apps Script or manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Natural Trends report script
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_VIRTUAL_SHEET_CREDENTIALS_JSON }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD_MKAWS }}
      run: |
        python natural_trends_report.py
